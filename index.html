<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>High Five</title>
<style>
  body { margin: 0; background: #111; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script type="module">
import { insertCoin, myPlayer, onPlayerJoin } from "https://esm.sh/playroomkit@latest";

const GAME_ID = "PASTE_YOUR_GAME_ID_HERE";
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

const players = new Map();
const mouse = { x: 400, y: 300 };
addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });

await insertCoin({ gameId: GAME_ID });

onPlayerJoin(state => {
  if (state.id === myPlayer().id) {
    state.setState("x", mouse.x);
    state.setState("y", mouse.y);
    state.setState("color", `hsl(${Math.random() * 360}, 70%, 55%)`);
  }
  players.set(state.id, state);
});

addEventListener("click", () => {
  const me = myPlayer();
  for (const [id, p] of players) {
    const dx = p.getState("x") - me.getState("x");
    const dy = p.getState("y") - me.getState("y");
    if (Math.hypot(dx, dy) < 60) {
      me.setState("highfive", true);
    }
  }
});

function loop() {
  const me = myPlayer();
  me.setState("x", mouse.x);
  me.setState("y", mouse.y);

  ctx.fillStyle = "#111";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (const [id, p] of players) {
    ctx.beginPath();
    ctx.arc(p.getState("x"), p.getState("y"), 20, 0, Math.PI * 2);
    ctx.fillStyle = p.getState("color") || "white";
    ctx.fill();

    if (p.getState("highfive")) {
      ctx.font = "24px serif";
      ctx.fillText("🖐️", p.getState("x") - 12, p.getState("y") - 30);
    }
  }

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
