<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cursors</title>
<style>
  body { margin: 0; background: #111; overflow: hidden; cursor: none; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script type="module">
import { insertCoin, myPlayer, onPlayerJoin } from "https://esm.sh/playroomkit@latest";

const GAME_ID = "PASTE_YOUR_GAME_ID_HERE";
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

const players = new Map();
const mouse = { x: 400, y: 300 };
addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });

await insertCoin({ gameId: GAME_ID });

onPlayerJoin(state => {
  if (state.id === myPlayer().id) {
    state.setState("color", `hsl(${Math.random() * 360}, 70%, 55%)`);
  }
  players.set(state.id, state);
});

function loop() {
  const me = myPlayer();
  me.setState("x", mouse.x);
  me.setState("y", mouse.y);

  ctx.fillStyle = "#111";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (const [id, p] of players) {
    ctx.fillStyle = p.getState("color") || "white";
    ctx.beginPath();
    ctx.arc(p.getState("x"), p.getState("y"), 6, 0, Math.PI * 2);
    ctx.fill();
  }

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
